
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: louka-store-airtrail_web_1
      APP_PORT: 3000

  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: airtrail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airtrail"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: johly/airtrail:latest
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/uploads:/app/uploads
    environment:
      ORIGIN: http://192.168.1.117:3000
      DB_URL: postgres://postgres:${APP_SEED}@db:5432/airtrail
      UPLOAD_LOCATION: /app/uploads
