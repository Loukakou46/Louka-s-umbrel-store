
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: louka-store-wanderer_web_1
      APP_PORT: 3000

  search:
    image: getmeili/meilisearch:v1.36.0
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data.ms:/meili_data/data.ms
    environment:
      MEILI_MASTER_KEY: ${APP_SEED}
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:7700/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  db:
    image: flomp/wanderer-db:latest
    restart: on-failure
    depends_on:
      search:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/pb_data:/pb_data
      - ${APP_DATA_DIR}/plugins:/data/plugins
    environment:
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${APP_SEED}
      POCKETBASE_ENCRYPTION_KEY: ${APP_PASSWORD}
      POCKETBASE_PROXY_SECRET: ${APP_SEED}
      ORIGIN: http://192.168.1.117:3000
    healthcheck:
      test: ["CMD", "/curl", "--fail", "http://localhost:8090/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  web:
    image: flomp/wanderer-web:latest
    restart: on-failure
    depends_on:
      search:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/uploads:/app/uploads
    environment:
      ORIGIN: http://192.168.1.117:3000
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${APP_SEED}
      POCKETBASE_PROXY_SECRET: ${APP_SEED}
      PUBLIC_POCKETBASE_URL: http://db:8090
      PUBLIC_DISABLE_SIGNUP: "false"
      BODY_SIZE_LIMIT: "2G"
      UPLOAD_FOLDER: /app/uploads
      OVERPASS_API_URL: https://overpass-api.de
      VALHALLA_URL: https://valhalla1.openstreetmap.de
      NOMINATIM_URL: https://nominatim.openstreetmap.org
      PUBLIC_MAP_MAX_POLYLINES: "100"
