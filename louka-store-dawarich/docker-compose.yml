
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: louka-store-dawarich_app_1
      APP_PORT: 3000

  redis:
    image: redis:8-alpine
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/redis:/data

  db:
    image: postgis/postgis:17-3.5-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: dawarich_production
    volumes:
      - ${APP_DATA_DIR}/db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dawarich_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: freikin/dawarich:latest
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ${APP_DATA_DIR}/public:/var/app/public
      - ${APP_DATA_DIR}/watched:/var/app/tmp/imports/watched
      - ${APP_DATA_DIR}/storage:/var/app/storage
    environment:
      RAILS_ENV: production
      SELF_HOSTED: "true"
      REDIS_URL: redis://redis:6379
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${APP_SEED}
      DATABASE_NAME: dawarich_production
      APPLICATION_HOSTS: localhost,127.0.0.1,192.168.1.117,umbrel.local
      APPLICATION_PROTOCOL: http
      TIME_ZONE: Europe/Paris
      SECRET_KEY_BASE: ${APP_SEED}
      SIDEKIQ_EMBEDDED: "true"
      WEB_CONCURRENCY: "0"
      BACKGROUND_PROCESSING_CONCURRENCY: "2"
    command: ["web-entrypoint.sh", "bin/rails", "server", "-p", "3000", "-b", "0.0.0.0"]
